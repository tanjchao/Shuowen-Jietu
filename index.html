<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f3eee6">
<title>說文解圖｜古文有戲，戲有古文</title>
<style>
:root{
  --paper:#fffdf8; --bg:#f3eee6; --ink:#3c3029; --muted:#78685f;
  --brown:#8b5940; --green:#709c7c; --line:#d9cabc;
  --shadow:0 12px 32px rgba(71,49,37,.12);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0; color:var(--ink);
  font-family:"Noto Serif TC","PingFang TC","Microsoft JhengHei",serif;
  background:
    radial-gradient(circle at 18% 10%,rgba(255,255,255,.85),transparent 25rem),
    linear-gradient(180deg,#eee5da 0,#f6f1e9 45%,#eee7dd 100%);
  min-height:100vh;
}
.page{width:min(1180px,calc(100% - 32px));margin:auto;padding:46px 0 34px}
.hero{text-align:center;margin-bottom:30px}
.kicker{font-size:13px;letter-spacing:.35em;color:var(--brown);font-weight:700;margin-bottom:10px}
h1{margin:0;font-size:clamp(42px,7vw,76px);letter-spacing:.12em;font-weight:900}
.subtitle{margin:10px 0 0;font-size:clamp(17px,2.5vw,23px);letter-spacing:.18em;color:var(--brown)}
.rule{display:flex;align-items:center;gap:12px;width:min(480px,78%);margin:21px auto 0;color:#b69a87}
.rule:before,.rule:after{content:"";height:1px;flex:1;background:linear-gradient(90deg,transparent,#cdb8a7)}
.rule:after{background:linear-gradient(90deg,#cdb8a7,transparent)}
.intro{margin:15px 0 0;color:var(--muted);font-size:15px;letter-spacing:.08em}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
.card{
  position:relative;display:flex;flex-direction:column;min-width:0;
  background:rgba(255,253,248,.94);border:1px solid var(--line);
  border-radius:18px;overflow:hidden;box-shadow:var(--shadow);
  text-decoration:none;color:inherit;transform:translateY(0);
  transition:transform .2s ease,box-shadow .2s ease,border-color .2s ease;
}
.card:hover,.card:focus-visible{transform:translateY(-7px);box-shadow:0 18px 42px rgba(71,49,37,.18);border-color:#b89378;outline:none}
.cover{aspect-ratio:4/3;overflow:hidden;background:#e7ddd1;position:relative}
.cover img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .35s ease}
.card:hover .cover img{transform:scale(1.035)}
.cover:after{content:"";position:absolute;inset:auto 0 0;height:32%;background:linear-gradient(transparent,rgba(30,20,15,.18));pointer-events:none}
.cardbody{padding:18px 17px 17px;display:flex;flex-direction:column;flex:1}
.card h2{margin:0;font-size:23px;letter-spacing:.04em}
.desc{margin:8px 0 17px;color:var(--muted);font-size:14px;line-height:1.7;min-height:48px}
.play{margin-top:auto;display:flex;align-items:center;justify-content:center;gap:7px;background:var(--brown);color:#fff;padding:11px 14px;border-radius:999px;font-family:"Microsoft JhengHei",sans-serif;font-size:14px;font-weight:800;letter-spacing:.08em}
.card.plus .play{background:#675b78}
.card.plus{border-color:#c9bfd2}
footer{text-align:center;color:#8b7b70;font-size:13px;margin-top:28px;letter-spacing:.08em}
@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}.page{padding-top:32px}}
@media(max-width:520px){
  .page{width:min(100% - 20px,1180px);padding-top:27px}
  .hero{margin-bottom:22px}
  .kicker{font-size:11px}.subtitle{letter-spacing:.12em}
  .grid{gap:10px}
  .card{border-radius:14px}
  .cardbody{padding:13px 11px 12px}
  .card h2{font-size:18px}
  .desc{font-size:12px;line-height:1.55;min-height:55px;margin:6px 0 11px}
  .play{font-size:12px;padding:9px 8px}
}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body>
<main class="page">
  <header class="hero">
    <div class="kicker">古文圖像理解挑戰</div>
    <h1>說文解圖</h1>
    <p class="subtitle">古文有戲，戲有古文</p>
    <div class="rule">◆</div>
    <p class="intro">選擇篇章，開始挑戰</p>
  </header>

  <section class="grid" aria-label="篇章選擇">
    <a class="card" href="https://tanjchao.github.io/Mulan-Poem/index.html">
      <div class="cover">
        <img src="https://tanjchao.github.io/Mulan-Poem/image/mulan_01.webp" alt="《木蘭詩》第一句插畫" loading="eager">
      </div>
      <div class="cardbody">
        <h2>木蘭詩</h2>
        <p class="desc">代父從軍，從圖像走進木蘭的征戰旅程。</p>
        <div class="play">開始挑戰 <span>→</span></div>
      </div>
    </a>

    <a class="card" href="https://tanjchao.github.io/Taohuayuan/">
      <div class="cover">
        <img src="https://tanjchao.github.io/Taohuayuan/images/tao_01.webp" alt="《桃花源記》第一句插畫" loading="eager">
      </div>
      <div class="cardbody">
        <h2>桃花源記</h2>
        <p class="desc">隨武陵漁人啟程，在文字與畫面間尋訪桃源。</p>
        <div class="play">開始挑戰 <span>→</span></div>
      </div>
    </a>

    <a class="card" href="https://tanjchao.github.io/guwen-game/index.html">
      <div class="cover">
        <img src="https://tanjchao.github.io/guwen-game/images/scene1.webp" alt="《左忠毅公軼事》第一句插畫" loading="eager">
      </div>
      <div class="cardbody">
        <h2>左忠毅公軼事</h2>
        <p class="desc">風雪訪賢，循著圖像重現忠毅風骨與師生情義。</p>
        <div class="play">開始挑戰 <span>→</span></div>
      </div>
    </a>

    <a class="card plus" href="https://tanjchao.github.io/Taohuayuan-Alien/">
      <div class="cover">
        <img src="taohuayuan-plus-cover.webp" alt="《桃花源記 PLUS》封面插畫" loading="eager">
      </div>
      <div class="cardbody">
        <h2>桃花源記 PLUS</h2>
        <p class="desc">似曾相識的桃花源……這一次，好像有哪裡不太一樣。</p>
        <div class="play">開始挑戰 <span>→</span></div>
      </div>
    </a>
  </section>

  <footer>說文解圖｜古文有戲，戲有古文</footer>
</main>
</body>
</html>
